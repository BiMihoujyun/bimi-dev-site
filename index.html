<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bimi.dev</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #faf8f5; --ink: #23201c; --dim: #7b736a; --line: #e2dcd3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16140f; --ink: #ece6dc; --dim: #8d857a; --line: #2e2a23; }
  }
  * { box-sizing: border-box }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    display: grid; place-items: center; padding: 2rem;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-feature-settings: "palt";
  }
  main { max-width: 26rem; width: 100% }
  h1 {
    margin: 0 0 1.6rem; font-size: 1.5rem; font-weight: 500;
    letter-spacing: .16em; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  hr { border: 0; border-top: 1px solid var(--line); margin: 1.6rem 0 }
  p { margin: .7rem 0; line-height: 2; color: var(--dim); font-size: .95rem }
</style>
</head>
<body>
<main>
  <h1>bimi.dev</h1>
  <hr>
  <p>ここはまだ、何もありません。</p>
  <p>置くものができたら、置きます。</p>
</main>
</body>
</html>
